<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A3A6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Facture">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Facture Scanner</title>
  <link rel="stylesheet" href="css/app.css">

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Tesseract.js OCR (async — doesn't block rendering) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" id="app-header">
      <button class="back-btn" id="headerBackBtn" aria-label="Volver">&#8592;</button>
      <span class="header-title" id="headerTitle">Facture Scanner</span>
    </header>

    <!-- Main content -->
    <main class="main-content">

      <!-- Page: Login -->
      <div class="page" id="page-login"></div>

      <!-- Page: Invoices (list + detail) -->
      <div class="page" id="page-invoices"></div>

      <!-- Page: Scan -->
      <div class="page" id="page-scan"></div>

      <!-- Page: Report -->
      <div class="page" id="page-report"></div>

      <!-- Page: Profile -->
      <div class="page" id="page-profile"></div>

    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tab-bar">
      <div class="tab-bar-inner">
        <div class="tab-item" data-route="invoices" data-tab="invoices">
          <span class="tab-icon">&#128196;</span>
          <span class="tab-label">Facturas</span>
        </div>
        <div class="tab-item" data-route="scan" data-tab="scan">
          <span class="tab-icon">&#128247;</span>
          <span class="tab-label">Escanear</span>
        </div>
        <div class="tab-item" data-route="report" data-tab="report">
          <span class="tab-icon">&#128200;</span>
          <span class="tab-label">Informes</span>
        </div>
        <div class="tab-item" data-route="profile" data-tab="profile">
          <span class="tab-icon">&#128100;</span>
          <span class="tab-label">Perfil</span>
        </div>
      </div>
    </nav>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loadingText">Cargando...</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/config.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/invoices.js"></script>
  <script src="js/ocr-preprocess.js"></script>
<script src="js/pages/scan.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/pages/profile.js"></script>

  <!-- App initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      Router.init();
    });

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
